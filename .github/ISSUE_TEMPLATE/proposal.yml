name: Proposal / Improvement
description: Propose a new package, operator, or tooling improvement.
title: "[Proposal] "
type: feature
body:
  - type: markdown
    attributes:
      value: |
        Use this form for concrete shared-feature proposals.

        Start with the problem and use case, then explain the current gap and any proposed public surface. Keep proposals scoped.

        If the idea is still vague or exploratory, it will usually work better as backlog notes than as a GitHub issue.

        Use the Docs form for docs-only improvements. If the docs reveal a missing shared feature or wrong behavior, use this form and cite the relevant page.
  - type: dropdown
    id: proposal_type
    attributes:
      label: Proposal type
      description: Choose the closest kind of shared feature you are proposing.
      options:
        - new package
        - new operator
        - tooling feature
  - type: dropdown
    id: proposed_owner
    attributes:
      label: Proposed owner
      description: Best guess only. Choose the narrowest shared surface that should own this.
      options:
        - core
        - tensor
        - vision
        - onnx
        - torch
        - meta
        - new package
        - other / not sure
  - type: textarea
    id: problem_use_case
    attributes:
      label: Problem and use case
      description: What are you trying to do, what is missing today, and where would this be useful? Start with "I want to do X, so I need Y."
      placeholder: |
        I want to build a pipeline that runs ...
        To do that, I need ...
        This would be useful in pipelines that ...
    validations:
      required: true
  - type: textarea
    id: current_workaround
    attributes:
      label: Current workaround or gap in existing surface
      description: Optional. What have you tried, and why is the current surface not enough?
      placeholder: |
        I tried composing ...
        Today the closest surface is ...
        It is not enough because ...
  - type: textarea
    id: proposed_surface
    attributes:
      label: Proposed public surface
      description: Optional. Describe the import path, operator name, CLI surface, report output, or similar. For operator proposals, include a minimal pipeline snippet and highlight the affected boundary or contract.
      placeholder: |
        from ml_pipes.core import Pipeline
        from ml_pipes.vision import Decode, Resize, SomeOperator

        pipeline = Pipeline([
            Decode(),
            SomeOperator(...),
            Resize((640, 640)),
        ])

        proposed surface: ml_pipes.vision.SomeOperator
        boundary: ImagePayload -> ImagePayload
