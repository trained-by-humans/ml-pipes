name: Release Packages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built packages to the configured package index
        required: true
        default: false
        type: boolean

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install build hatchling twine

      - name: Build packages
        if: ${{ !inputs.publish }}
        run: python scripts/release_packages.py --dry-run --outdir dist/release

      - name: Publish packages
        if: ${{ inputs.publish }}
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: python scripts/release_packages.py --publish --outdir dist/release

      - name: Upload artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/release
