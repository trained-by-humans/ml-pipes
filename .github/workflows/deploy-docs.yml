name: Pages

run-name: "Docs: ${{ github.ref_name }}"

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install "mkdocs-pixel-lab==0.1.3"

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build documentation
        run: mkdocs build --strict --site-dir _site

      - name: Verify SEO output
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          robots = Path('_site/robots.txt').read_text().splitlines()
          assert 'User-agent: *' in robots and 'Allow: /' in robots
          assert 'Sitemap: https://ml-pipes.com/sitemap.xml' in robots
          urls = ET.parse('_site/sitemap.xml').getroot()
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          assert len(urls) > 0
          assert all(url.findtext(ns + 'lastmod') for url in urls)
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
