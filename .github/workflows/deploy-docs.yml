name: Pages

run-name: "Docs: ${{ github.event.pull_request.title || github.head_ref || github.ref_name }}"

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Documentation Paths and Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check documentation filenames
        run: python .github/scripts/check_docs_paths.py

      - name: Install documentation and test dependencies
        run: python -m pip install pytest "mkdocs-pixel-lab==0.1.3"

      - name: Test documentation path checks
        run: python -m pytest -q .github/tests/test_check_docs_paths.py

      - name: Build documentation
        run: python -m mkdocs build --strict --site-dir _site

      - name: Check generated page URLs
        run: python .github/scripts/check_docs_paths.py --site-dir _site

      - name: Verify SEO output
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          robots = Path('_site/robots.txt').read_text().splitlines()
          assert 'User-agent: *' in robots and 'Allow: /' in robots
          assert 'Sitemap: https://ml-pipes.com/sitemap.xml' in robots
          urls = ET.parse('_site/sitemap.xml').getroot()
          ns = '{http://www.sitemaps.org/schemas/sitemap/0.9}'
          assert len(urls) > 0
          assert all(url.findtext(ns + 'lastmod') for url in urls)
          PY

      - name: Check tracked files for mutations
        run: git diff --exit-code

      - name: Upload Pages artifact
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
