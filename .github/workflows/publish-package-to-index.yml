name: Publish Package

on:
  workflow_call:
    inputs:
      publish_target:
        description: Package index target to publish to.
        required: true
        type: string
      dist_name:
        description: Canonical distribution name to stage, check, and publish.
        required: true
        type: string
      checkout_ref:
        description: Git ref to check out while staging and publishing artifacts.
        required: false
        type: string

jobs:
  publish:
    name: Publish ${{ inputs.dist_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

      - name: Check package index token
        env:
          TEST_PYPI_API_TOKEN: ${{ secrets.TEST_PYPI_API_TOKEN }}
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          case "${{ inputs.publish_target }}" in
            testpypi)
              if [ -z "${TEST_PYPI_API_TOKEN}" ]; then
                echo "Missing repository secret TEST_PYPI_API_TOKEN." >&2
                echo "Add TEST_PYPI_API_TOKEN under Settings -> Secrets and variables -> Actions." >&2
                exit 1
              fi
              ;;
            pypi)
              if [ -z "${PYPI_API_TOKEN}" ]; then
                echo "Missing repository secret PYPI_API_TOKEN." >&2
                echo "Add PYPI_API_TOKEN under Settings -> Secrets and variables -> Actions." >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported publish target: ${{ inputs.publish_target }}" >&2
              exit 1
              ;;
          esac

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release

      - name: Stage artifacts for distribution
        run: |
          python3 .github/scripts/stage_release_artifacts.py \
            --artifacts-dir dist/release \
            --staging-dir publish \
            --dist-name "${{ inputs.dist_name }}"

      - name: Resolve publish target
        id: resolve_publish_target
        shell: bash
        run: |
          case "${{ inputs.publish_target }}" in
            testpypi)
              echo "index_url_base=https://test.pypi.org" >> "$GITHUB_OUTPUT"
              ;;
            pypi)
              echo "index_url_base=https://pypi.org" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported publish target: ${{ inputs.publish_target }}" >&2
              exit 1
              ;;
          esac

      - name: Check staged artifacts against package index
        id: check_index_artifacts
        run: |
          python3 .github/scripts/check_index_artifacts.py \
            --packages-dir publish \
            --dist-name "${{ inputs.dist_name }}" \
            --index-url-base "${{ steps.resolve_publish_target.outputs.index_url_base }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish package to TestPyPI
        if: ${{ inputs.publish_target == 'testpypi' && steps.check_index_artifacts.outputs.artifacts_missing == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          packages-dir: publish
          repository-url: https://test.pypi.org/legacy/

      - name: Publish package to PyPI
        if: ${{ inputs.publish_target == 'pypi' && steps.check_index_artifacts.outputs.artifacts_missing == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: publish
