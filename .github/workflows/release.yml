name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  validate-release:
    name: Validate Release Metadata
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate package versions and publish order
        run: |
          args=(--validate)
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            args+=(--tag "${GITHUB_REF_NAME}")
          fi
          python scripts/release_packages.py "${args[@]}"

  build:
    name: Build Release Artifacts
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install release tooling
        run: python -m pip install -r requirements-release.txt

      - name: Build packages
        run: python scripts/release_packages.py --dry-run --outdir dist/release

      - name: Check built metadata
        run: python -m twine check dist/release/*

      - name: Check tracked files for mutations
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/release

  publish-testpypi-core:
    name: Publish TestPyPI Core
    if: ${{ github.event_name == 'push' }}
    needs: build
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: testpypi
      dist_name: ml-pipes-core

  publish-testpypi-tensor:
    name: Publish TestPyPI Tensor
    if: ${{ github.event_name == 'push' }}
    needs: publish-testpypi-core
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: testpypi
      dist_name: ml-pipes-tensor

  publish-testpypi-vision:
    name: Publish TestPyPI Vision
    if: ${{ github.event_name == 'push' }}
    needs: publish-testpypi-tensor
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: testpypi
      dist_name: ml-pipes-vision

  publish-testpypi-onnx:
    name: Publish TestPyPI ONNX
    if: ${{ github.event_name == 'push' }}
    needs: publish-testpypi-vision
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: testpypi
      dist_name: ml-pipes-onnx

  publish-testpypi-torch:
    name: Publish TestPyPI Torch
    if: ${{ github.event_name == 'push' }}
    needs: publish-testpypi-onnx
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: testpypi
      dist_name: ml-pipes-torch

  publish-testpypi-meta:
    name: Publish TestPyPI Meta
    if: ${{ github.event_name == 'push' }}
    needs: publish-testpypi-torch
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: testpypi
      dist_name: ml-pipes

  publish-pypi-core:
    name: Publish PyPI Core
    if: ${{ github.event_name == 'push' }}
    needs: publish-testpypi-meta
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: pypi
      dist_name: ml-pipes-core

  publish-pypi-tensor:
    name: Publish PyPI Tensor
    if: ${{ github.event_name == 'push' }}
    needs: publish-pypi-core
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: pypi
      dist_name: ml-pipes-tensor

  publish-pypi-vision:
    name: Publish PyPI Vision
    if: ${{ github.event_name == 'push' }}
    needs: publish-pypi-tensor
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: pypi
      dist_name: ml-pipes-vision

  publish-pypi-onnx:
    name: Publish PyPI ONNX
    if: ${{ github.event_name == 'push' }}
    needs: publish-pypi-vision
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: pypi
      dist_name: ml-pipes-onnx

  publish-pypi-torch:
    name: Publish PyPI Torch
    if: ${{ github.event_name == 'push' }}
    needs: publish-pypi-onnx
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: pypi
      dist_name: ml-pipes-torch

  publish-pypi-meta:
    name: Publish PyPI Meta
    if: ${{ github.event_name == 'push' }}
    needs: publish-pypi-torch
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-package.yml
    with:
      publish_target: pypi
      dist_name: ml-pipes
