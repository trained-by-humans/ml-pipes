name: Publish Artifacts To Index

on:
  workflow_call:
    inputs:
      index_url_base:
        description: Base package index URL used for artifact existence checks.
        required: true
        type: string
      repository_url:
        description: Upload endpoint for the selected package index.
        required: true
        type: string
      dist_name:
        description: Canonical distribution name to stage, check, and publish.
        required: true
        type: string
      checkout_ref:
        description: Git ref to check out while staging and publishing artifacts.
        required: false
        type: string
      environment_name:
        description: GitHub environment that supplies the package index token.
        required: true
        type: string
    secrets:
      PYPI_API_TOKEN:
        description: Package index token supplied by the selected environment.
        required: false

jobs:
  publish:
    name: Publish ${{ inputs.dist_name }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.checkout_ref != '' && inputs.checkout_ref || github.ref }}

      - name: Check package index token
        env:
          PACKAGE_INDEX_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          if [ -z "${PACKAGE_INDEX_API_TOKEN}" ]; then
            echo "Missing PYPI_API_TOKEN environment secret for ${{ inputs.environment_name }}." >&2
            exit 1
          fi

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist/release

      - name: Stage artifacts for distribution
        run: |
          python3 .github/scripts/stage_release_artifacts.py \
            --artifacts-dir dist/release \
            --staging-dir publish \
            --dist-name "${{ inputs.dist_name }}"

      - name: Check staged artifacts against package index
        id: check_package_index_artifacts
        run: |
          python3 .github/scripts/check_package_index_artifacts.py \
            --artifacts-dir publish \
            --dist-name "${{ inputs.dist_name }}" \
            --index-url-base "${{ inputs.index_url_base }}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Publish artifacts
        if: ${{ steps.check_package_index_artifacts.outputs.artifacts_missing == 'true' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: publish
          repository-url: ${{ inputs.repository_url }}
