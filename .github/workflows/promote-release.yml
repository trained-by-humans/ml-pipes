name: Release Promotion

run-name: "Release: ${{ inputs.tag }}"

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.1.0rc1.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release:
    name: Validate Release Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate package versions and publish order
        run: python .github/scripts/release_packages.py --validate --tag "${{ inputs.tag }}"

  prepare-release-assets:
    name: Fetch Staged Release Assets
    needs: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download staged release assets from GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/release
          gh release download "${{ inputs.tag }}" --dir dist/release --clobber

      - name: Verify staged release asset manifest
        run: |
          python .github/scripts/release_asset_manifest.py verify \
            --artifacts-dir dist/release \
            --manifest dist/release/release-artifact-manifest.json \
            --tag "${{ inputs.tag }}"

      - name: Check tracked files for mutations
        run: |
          git diff --exit-code
          git diff --cached --exit-code

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/release

  publish-pypi-core:
    name: Publish PyPI Core
    needs: prepare-release-assets
    permissions:
      contents: read
    uses: ./.github/workflows/publish-package-to-index.yml
    with:
      index_url_base: https://pypi.org
      repository_url: https://upload.pypi.org/legacy/
      dist_name: ml-pipes-core
      checkout_ref: ${{ inputs.tag }}
    secrets:
      package_index_api_token: ${{ secrets.PYPI_API_TOKEN }}

  publish-pypi-tensor:
    name: Publish PyPI Tensor
    needs: publish-pypi-core
    permissions:
      contents: read
    uses: ./.github/workflows/publish-package-to-index.yml
    with:
      index_url_base: https://pypi.org
      repository_url: https://upload.pypi.org/legacy/
      dist_name: ml-pipes-tensor
      checkout_ref: ${{ inputs.tag }}
    secrets:
      package_index_api_token: ${{ secrets.PYPI_API_TOKEN }}

  publish-pypi-vision:
    name: Publish PyPI Vision
    needs: publish-pypi-tensor
    permissions:
      contents: read
    uses: ./.github/workflows/publish-package-to-index.yml
    with:
      index_url_base: https://pypi.org
      repository_url: https://upload.pypi.org/legacy/
      dist_name: ml-pipes-vision
      checkout_ref: ${{ inputs.tag }}
    secrets:
      package_index_api_token: ${{ secrets.PYPI_API_TOKEN }}

  publish-pypi-onnx:
    name: Publish PyPI ONNX
    needs: publish-pypi-vision
    permissions:
      contents: read
    uses: ./.github/workflows/publish-package-to-index.yml
    with:
      index_url_base: https://pypi.org
      repository_url: https://upload.pypi.org/legacy/
      dist_name: ml-pipes-onnx
      checkout_ref: ${{ inputs.tag }}
    secrets:
      package_index_api_token: ${{ secrets.PYPI_API_TOKEN }}

  publish-pypi-torch:
    name: Publish PyPI Torch
    needs: publish-pypi-onnx
    permissions:
      contents: read
    uses: ./.github/workflows/publish-package-to-index.yml
    with:
      index_url_base: https://pypi.org
      repository_url: https://upload.pypi.org/legacy/
      dist_name: ml-pipes-torch
      checkout_ref: ${{ inputs.tag }}
    secrets:
      package_index_api_token: ${{ secrets.PYPI_API_TOKEN }}

  publish-pypi-meta:
    name: Publish PyPI Meta
    needs: publish-pypi-torch
    permissions:
      contents: read
    uses: ./.github/workflows/publish-package-to-index.yml
    with:
      index_url_base: https://pypi.org
      repository_url: https://upload.pypi.org/legacy/
      dist_name: ml-pipes
      checkout_ref: ${{ inputs.tag }}
    secrets:
      package_index_api_token: ${{ secrets.PYPI_API_TOKEN }}

  verify-pypi:
    name: Verify PyPI Packages
    needs: publish-pypi-meta
    permissions:
      contents: read
    uses: ./.github/workflows/verify-published-packages.yml
    with:
      target_name: PyPI
      index_url: https://pypi.org/simple/
      checkout_ref: ${{ inputs.tag }}
      tag: ${{ inputs.tag }}
