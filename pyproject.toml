[project]
name = "ml-pipes-workspace"
version = "0.0.0"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest",
]
core = [
    "ml-pipes-core",
]
shared-framework = [
    "ml-pipes-onnx",
    "ml-pipes-vision",
]
torch = [
    "ml-pipes-torch",
]
inspection-otel = [
    "ml-pipes-core[inspection,otel]",
]
full-workspace = [
    { include-group = "shared-framework" },
    { include-group = "torch" },
    "ml-pipes",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/core",
    "packages/tensor",
    "packages/vision",
    "packages/onnx",
    "packages/torch",
    "packages/meta",
]

[tool.uv.sources]
ml-pipes = { workspace = true }
ml-pipes-core = { workspace = true }
ml-pipes-onnx = { workspace = true }
ml-pipes-tensor = { workspace = true }
ml-pipes-torch = { workspace = true }
ml-pipes-vision = { workspace = true }

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests", "packages", "examples"]
