[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-pipes-vision"
version = "0.1.0"
description = "Vision payloads and vision-domain operators for ml-pipes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "detection",
    "image",
    "machine-learning",
    "pipelines",
    "vision",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "ml-pipes-core==0.1.0",
    "ml-pipes-tensor==0.1.0",
    "numpy>=1.26",
    "opencv-python>=4.9",
]

[project.urls]
Homepage = "https://github.com/trained-by-humans/ml-pipes"
Documentation = "https://github.com/trained-by-humans/ml-pipes/blob/main/packages/vision/docs/INDEX.md"
Repository = "https://github.com/trained-by-humans/ml-pipes"
Issues = "https://github.com/trained-by-humans/ml-pipes/issues"
Changelog = "https://github.com/trained-by-humans/ml-pipes/releases"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipes"]

[tool.hatch.build.targets.sdist]
include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src/ml_pipes",
]
