[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-pipes-core"
version = "0.1.0"
description = "Core runtime, validation, tracing, inspection, and standard operators for ml-pipes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "typing_extensions>=4.9",
]

[project.optional-dependencies]
inspection = [
    "ml-pipes-onnx==0.1.0",
    "ml-pipes-tensor==0.1.0",
    "ml-pipes-vision==0.1.0",
    "opencv-python>=4.9",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.scripts]
ml-pipes = "ml_pipes.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipes"]

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "pyproject.toml",
    "src/ml_pipes",
]
