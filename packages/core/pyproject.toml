[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-pipes-core"
version = "0.1.0"
description = "Core runtime, validation, tracing, inspection, and standard operators for ml-pipes"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "benchmarking",
    "framework",
    "machine-learning",
    "pipelines",
    "validation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "typing_extensions>=4.9",
]

[project.urls]
Homepage = "https://github.com/trained-by-humans/ml-pipes"
Documentation = "https://github.com/trained-by-humans/ml-pipes/blob/main/packages/core/docs/INDEX.md"
Repository = "https://github.com/trained-by-humans/ml-pipes"
Issues = "https://github.com/trained-by-humans/ml-pipes/issues"
Changelog = "https://github.com/trained-by-humans/ml-pipes/releases"

[project.optional-dependencies]
inspection = [
    "ml-pipes-onnx==0.1.0",
    "ml-pipes-tensor==0.1.0",
    "ml-pipes-vision==0.1.0",
    "matplotlib>=3.8",
    "opencv-python>=4.9",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]

[project.scripts]
ml-pipes = "ml_pipes.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipes"]

[tool.hatch.build.targets.sdist]
include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
    "src/ml_pipes",
]
