[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-pipes-onnx"
version = "0.1.0"
description = "ONNX runtime operators and output types for ml-pipes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ml-pipes-core==0.1.0",
    "ml-pipes-tensor==0.1.0",
    "numpy>=1.26",
    "onnxruntime>=1.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ml_pipes"]

[tool.hatch.build.targets.sdist]
include = [
    "README.md",
    "pyproject.toml",
    "src/ml_pipes",
]
