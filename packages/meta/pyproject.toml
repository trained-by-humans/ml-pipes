[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ml-pipes"
version = "0.1.0rc1"
description = "Umbrella meta-package for ml-pipes component installs"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "framework",
    "machine-learning",
    "onnx",
    "pipelines",
    "torch",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
requires-python = ">=3.10"
dependencies = [
    "ml-pipes-core==0.1.0rc1",
]

[project.urls]
Homepage = "https://github.com/trained-by-humans/ml-pipes"
Documentation = "https://github.com/trained-by-humans/ml-pipes/blob/main/docs/PACKAGES.md"
Repository = "https://github.com/trained-by-humans/ml-pipes"
Issues = "https://github.com/trained-by-humans/ml-pipes/issues"
Changelog = "https://github.com/trained-by-humans/ml-pipes/releases"

[project.optional-dependencies]
inspection = [
    "ml-pipes-core[inspection]==0.1.0rc1",
]
onnx = [
    "ml-pipes-onnx==0.1.0rc1",
]
otel = [
    "ml-pipes-core[otel]==0.1.0rc1",
]
tensor = [
    "ml-pipes-tensor==0.1.0rc1",
]
torch = [
    "ml-pipes-torch==0.1.0rc1",
]
vision = [
    "ml-pipes-vision==0.1.0rc1",
]
all = [
    "ml-pipes-core[inspection,otel]==0.1.0rc1",
    "ml-pipes-onnx==0.1.0rc1",
    "ml-pipes-tensor==0.1.0rc1",
    "ml-pipes-torch==0.1.0rc1",
    "ml-pipes-vision==0.1.0rc1",
]

[tool.hatch.build.targets.wheel]
bypass-selection = true

[tool.hatch.build.targets.sdist]
include = [
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
